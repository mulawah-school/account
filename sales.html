<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نقطة البيع - POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="p-2 hover:bg-white/10 rounded-full transition-colors">
          <i data-lucide="arrow-right" class="w-6 h-6"></i>
        </a>
        <h1 class="text-xl font-bold">الفاتورة السريعة</h1>
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
    <div class="lg:col-span-8 space-y-6">
      <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <input id="q" placeholder="ابحث عن صنف..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"/>
          <select id="productSelect" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none bg-slate-50"></select>
        </div>
        <div class="flex flex-col md:flex-row items-center gap-4">
          <div class="w-full md:w-1/3">
            <label class="block text-xs font-bold text-slate-400 mb-1">الكمية</label>
            <input id="qty" type="number" step="0.001" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-lg"/>
          </div>
          <div class="flex-grow pt-5 w-full">
            <button id="add" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition-all flex items-center justify-center gap-2">
              <i data-lucide="shopping-basket" class="w-5 h-5"></i> إضافة للسلة
            </button>
          </div>
          <div id="stockLine" class="text-sm text-amber-600 font-bold pt-5">المتوفر: —</div>
        </div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-right">
          <thead class="bg-slate-50 text-slate-500 text-sm font-bold">
            <tr>
              <th class="px-6 py-4">الصنف</th>
              <th class="px-6 py-4 text-center">الكمية</th>
              <th class="px-6 py-4 text-center">السعر</th>
              <th class="px-6 py-4 text-center">الإجمالي</th>
            </tr>
          </thead>
          <tbody id="cart" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
    <div class="lg:col-span-4">
      <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sticky top-24 space-y-6">
        <div class="text-center pb-4 border-b border-dashed">
          <h3 class="text-slate-500 text-sm font-bold uppercase">إجمالي الفاتورة</h3>
          <div id="totalDisplay" class="text-4xl font-extrabold text-indigo-700 my-2">0.000 <span class="text-lg">OMR</span></div>
        </div>
        <div class="space-y-4">
          <select id="pay" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none">
            <option value="cash">نقدي 💵</option>
            <option value="deferred">دين مؤجل 📱</option>
          </select>
          <div id="deferredBox" class="hidden space-y-3 bg-amber-50 p-4 rounded-xl border border-amber-100">
            <input id="cname" placeholder="اسم الزبون" class="w-full px-3 py-2 rounded-lg border border-amber-200"/>
            <input id="cphone" placeholder="رقم الهاتف" class="w-full px-3 py-2 rounded-lg border border-amber-200"/>
            <input id="due" type="date" class="w-full px-3 py-2 rounded-lg border border-amber-200"/>
          </div>
          <input id="paid" type="number" placeholder="المبلغ المدفوع" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 font-mono text-xl"/>
        </div>
        <button id="save" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-indigo-700 shadow-xl shadow-indigo-100">تأكيد وحفظ الفاتورة</button>
      </div>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
