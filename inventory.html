<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نقطة البيع - POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; }
    /* تحسين شكل التمرير */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navigation -->
  <nav class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="p-2 hover:bg-white/10 rounded-full transition-colors">
          <i data-lucide="arrow-right" class="w-6 h-6"></i>
        </a>
        <div class="flex flex-col">
          <h1 class="text-xl font-bold leading-none">نقطة البيع السريعة</h1>
          <span class="text-[10px] opacity-70 uppercase tracking-wider">Point of Sale System</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
         <span id="hint" class="bg-indigo-800 px-3 py-1 rounded-full text-xs border border-indigo-400/30">جاهز للبيع</span>
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
    
    <!-- Left Section: Product Selection & Cart -->
    <div class="lg:col-span-8 space-y-6">
      
      <!-- Selection Card -->
      <div class="bg-white rounded-3xl shadow-sm p-6 border border-slate-200">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="relative">
            <i data-lucide="search" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
            <input id="q" placeholder="ابحث عن صنف (SKU أو اسم)..." class="w-full pr-10 pl-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-slate-50 focus:bg-white"/>
            <button id="search" class="hidden"></button> <!-- Keep for logic compatibility -->
          </div>
          <div class="relative">
            <select id="productSelect" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none bg-slate-50 appearance-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              <!-- سيتم ملء البيانات برمجياً -->
            </select>
            <i data-lucide="chevron-down" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
          </div>
        </div>

        <div class="flex flex-col md:flex-row items-end gap-4">
          <div class="w-full md:w-1/3">
            <label class="block text-xs font-bold text-slate-500 mb-2 mr-1">الكمية المباعة</label>
            <div class="relative">
              <input id="qty" type="number" step="0.001" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-lg bg-slate-50 focus:bg-white"/>
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-xs font-bold">QTY</span>
            </div>
          </div>
          <div class="flex-grow w-full">
            <button id="add" class="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-bold hover:bg-emerald-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-100 active:scale-[0.98]">
              <i data-lucide="shopping-cart" class="w-5 h-5"></i> إضافة للفاتورة
            </button>
          </div>
          <div id="stockLine" class="w-full md:w-auto text-center px-4 py-2 bg-amber-50 rounded-xl border border-amber-100 text-xs font-bold text-amber-700 whitespace-nowrap">
            المتوفر: —
          </div>
        </div>
      </div>

      <!-- Cart Table Card -->
      <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-5 border-b border-slate-50 flex justify-between items-center">
          <h3 class="font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="list" class="w-5 h-5 text-indigo-500"></i> قائمة المشتريات
          </h3>
          <span class="text-xs text-slate-400">تلقائي التحديث</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-right">
            <thead class="bg-slate-50/50 text-slate-500 text-xs font-bold uppercase">
              <tr>
                <th class="px-6 py-4">الصنف</th>
                <th class="px-6 py-4 text-center">الكمية</th>
                <th class="px-6 py-4 text-center">السعر</th>
                <th class="px-6 py-4 text-center">الإجمالي</th>
              </tr>
            </thead>
            <tbody id="cart" class="divide-y divide-slate-100">
              <!-- Cart items will appear here -->
            </tbody>
          </table>
          <!-- Empty State (Optional) -->
          <div id="emptyCart" class="p-12 text-center hidden">
            <i data-lucide="shopping-bag" class="w-12 h-12 text-slate-200 mx-auto mb-3"></i>
            <p class="text-slate-400 text-sm">السلة فارغة، ابدأ بإضافة المنتجات</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section: Checkout -->
    <div class="lg:col-span-4">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sticky top-24 space-y-6">
        
        <div class="text-center pb-6 border-b border-dashed border-slate-200">
          <h3 class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">إجمالي المطلوب</h3>
          <div id="totalDisplay" class="text-5xl font-black text-indigo-700 tracking-tight">
            0.000 <span class="text-lg font-bold text-indigo-400">OMR</span>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-2 mr-1">طريقة الدفع</label>
            <select id="pay" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
              <option value="cash">نقدي 💵</option>
              <option value="deferred">دين مؤجل 📱</option>
            </select>
          </div>

          <!-- Deferred Details Box -->
          <div id="deferredBox" class="hidden space-y-3 bg-amber-50 p-4 rounded-2xl border border-amber-100 animate-in fade-in slide-in-from-top-2 duration-300">
            <div class="flex items-center gap-2 text-amber-700 font-bold text-sm mb-1">
              <i data-lucide="info" class="w-4 h-4"></i> بيانات الزبون
            </div>
            <input id="cname" placeholder="اسم الزبون" class="w-full px-4 py-2.5 rounded-xl border border-amber-200 outline-none focus:ring-2 focus:ring-amber-500 bg-white/50"/>
            <input id="cphone" placeholder="رقم الهاتف (968...)" class="w-full px-4 py-2.5 rounded-xl border border-amber-200 outline-none focus:ring-2 focus:ring-amber-500 bg-white/50"/>
            <input id="due" type="date" class="w-full px-4 py-2.5 rounded-xl border border-amber-200 outline-none focus:ring-2 focus:ring-amber-500 bg-white/50 text-sm"/>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 mb-2 mr-1">المبلغ المدفوع (اختياري)</label>
            <div class="relative">
              <input id="paid" type="number" step="0.001" placeholder="0.000" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 font-mono text-xl text-indigo-600 focus:ring-2 focus:ring-indigo-500 outline-none"/>
              <i data-lucide="wallet" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5"></i>
            </div>
          </div>
        </div>

        <button id="save" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-xl hover:bg-indigo-700 shadow-2xl shadow-indigo-200 transition-all active:scale-[0.97] flex items-center justify-center gap-3">
          <i data-lucide="check-circle-2" class="w-6 h-6"></i> تأكيد وحفظ العملية
        </button>

        <p class="text-[10px] text-center text-slate-400">بمجرد الحفظ سيتم تحديث المخزون وتسجيل المبيعات تلقائياً</p>
      </div>
    </div>
  </main>

  <script>
    // تفعيل الأيقونات
    lucide.createIcons();

    // ملاحظة: المنطق البرمجي (JavaScript) يجب أن يبقى كما هو في نسختك الأصلية
    // ليعمل مع نظام LocalStorage الخاص بك.
  </script>
</body>
</html>
