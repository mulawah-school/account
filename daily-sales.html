<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<link rel="stylesheet" href="style.css"/>

<title>البيع اليومي</title>

<style>

.formgrid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
margin-bottom:15px;
}

input{
padding:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

th{
background:#f3f4f6;
}

.summary{
margin-top:20px;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<div class="top">

<h1>📊 البيع اليومي</h1>

<a class="badge" href="index.html">⬅ الرجوع للرئيسية</a>

</div>


<div class="card">

<div class="formgrid">

<input type="date" id="date">

<input id="sellerName" placeholder="الاسم">

<input id="phone" placeholder="الرقم">

<input id="product" placeholder="الصنف">

<input id="received" placeholder="الكمية المستلمة">

<input id="sold" placeholder="الكمية المباعة">

<input id="price" placeholder="سعر البيع للحبة">

<input id="percent" placeholder="النسبة %">

<button onclick="save()">حفظ</button>

</div>

</div>


<div class="card">

<h3>📋 البيانات المدخلة</h3>

<table>

<thead>

<tr>

<th>التاريخ</th>
<th>الاسم</th>
<th>الرقم</th>
<th>الصنف</th>
<th>المستلم</th>
<th>المباع</th>
<th>الباقي</th>
<th>سعر الحبة</th>
<th>المجموع</th>
<th>الفائدة</th>
<th>حذف</th>

</tr>

</thead>

<tbody id="table"></tbody>

</table>


<div class="summary">

<p>إجمالي البيع اليومي: <b id="totalSales">0</b> ريال</p>

<p>إجمالي الفائدة: <b id="totalProfit">0</b> ريال</p>

<p>الكميات المباعة لكل صنف:</p>

<div id="productTotals"></div>

</div>

</div>

</div>



<script>

let data = JSON.parse(localStorage.getItem("daily_sales") || "[]")

function getCarry(product,date){

let previous = data.filter(d=> d.product === product && d.date < date)

if(previous.length === 0) return 0

return previous[previous.length-1].remaining

}


function save(){

const date = document.getElementById("date").value
const name = document.getElementById("sellerName").value
const phone = document.getElementById("phone").value
const product = document.getElementById("product").value

const received = Number(document.getElementById("received").value)
const sold = Number(document.getElementById("sold").value)

const price = Number(document.getElementById("price").value)
const percent = Number(document.getElementById("percent").value)

const carry = getCarry(product,date)

const receivedTotal = received + carry

const remaining = receivedTotal - sold

const total = sold * price

const profit = total * (percent/100)

data.push({

date,
name,
phone,
product,
received:receivedTotal,
sold,
remaining,
price,
total,
profit

})

localStorage.setItem("daily_sales",JSON.stringify(data))

render()

}



function deleteRow(i){

data.splice(i,1)

localStorage.setItem("daily_sales",JSON.stringify(data))

render()

}



function render(){

const date = document.getElementById("date").value

let today = data.filter(d=> d.date === date)

table.innerHTML=""

let totalSales = 0
let totalProfit = 0

let products = {}

today.forEach((d,i)=>{

totalSales += d.total
totalProfit += d.profit

products[d.product] = (products[d.product] || 0) + d.sold

table.innerHTML += `

<tr>

<td>${d.date}</td>
<td>${d.name}</td>
<td>${d.phone}</td>
<td>${d.product}</td>
<td>${d.received}</td>
<td>${d.sold}</td>
<td>${d.remaining}</td>
<td>${d.price}</td>
<td>${d.total.toFixed(2)}</td>
<td>${d.profit.toFixed(2)}</td>

<td>
<button onclick="deleteRow(${i})">❌</button>
</td>

</tr>

`

})


document.getElementById("totalSales").innerText = totalSales.toFixed(2)
document.getElementById("totalProfit").innerText = totalProfit.toFixed(2)


let list = ""

for(let p in products){

list += `<p>${p} : ${products[p]}</p>`

}

document.getElementById("productTotals").innerHTML = list

}

document.getElementById("date").addEventListener("change",render)

</script>

</body>
</html>
