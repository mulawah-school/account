<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>البيع اليومي - نظام المحاسبة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f0fdfa; }
  </style>
</head>
<body class="min-h-screen">

  <nav class="bg-teal-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="p-2 hover:bg-white/20 rounded-full transition-colors text-white">
          <i data-lucide="arrow-right" class="w-6 h-6"></i>
        </a>
        <h1 class="text-xl font-bold">تسجيل البيع اليومي</h1>
      </div>
      <input type="date" id="date" class="bg-teal-700 text-white px-4 py-2 rounded-xl outline-none border border-teal-500 text-sm"/>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Input Form Card -->
    <div class="bg-white rounded-3xl shadow-lg border border-teal-100 p-8 mb-8">
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4">
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500">اسم الموظف</label>
          <input id="name" placeholder="الاسم" class="w-full px-3 py-2 rounded-lg border border-slate-200 outline-none bg-slate-50"/>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500">اسم الصنف</label>
          <input id="product" placeholder="الصنف" class="w-full px-3 py-2 rounded-lg border border-slate-200 outline-none bg-slate-50"/>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500">المستلم</label>
          <input id="received" type="number" placeholder="0" class="w-full px-3 py-2 rounded-lg border border-slate-200 outline-none bg-slate-50"/>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500">المباع</label>
          <input id="sold" type="number" placeholder="0" class="w-full px-3 py-2 rounded-lg border border-slate-200 outline-none bg-slate-50"/>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500">السعر</label>
          <input id="price" type="number" step="0.001" placeholder="0.000" class="w-full px-3 py-2 rounded-lg border border-slate-200 outline-none bg-slate-50 font-bold"/>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-slate-500">النسبة %</label>
          <input id="percent" type="number" placeholder="5" class="w-full px-3 py-2 rounded-lg border border-slate-200 outline-none bg-slate-50"/>
        </div>
      </div>
      <button id="add" onclick="add()" class="mt-6 w-full bg-teal-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-teal-700 shadow-xl shadow-teal-100 transition-all">
        حفظ العملية اليومية
      </button>
    </div>

    <!-- Summary Statistics -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-gradient-to-br from-indigo-600 to-indigo-700 p-6 rounded-3xl text-white shadow-xl">
        <h4 class="text-indigo-100 text-sm font-bold uppercase tracking-widest">إجمالي المبيعات اليومية</h4>
        <div id="totalSales" class="text-3xl font-black mt-2">0.000 OMR</div>
      </div>
      <div class="bg-gradient-to-br from-emerald-600 to-emerald-700 p-6 rounded-3xl text-white shadow-xl">
        <h4 class="text-emerald-100 text-sm font-bold uppercase tracking-widest">إجمالي الفائدة اليومية</h4>
        <div id="totalProfit" class="text-3xl font-black mt-2">0.000 OMR</div>
      </div>
    </div>

    <!-- Results Table -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-right text-sm">
          <thead class="bg-slate-50 text-slate-500">
            <tr>
              <th class="px-4 py-4">التاريخ</th>
              <th class="px-4 py-4">الاسم</th>
              <th class="px-4 py-4">الصنف</th>
              <th class="px-4 py-4 text-center">المباع</th>
              <th class="px-4 py-4 text-center">المتبقي</th>
              <th class="px-4 py-4 text-center">المجموع</th>
              <th class="px-4 py-4 text-center">الفائدة</th>
              <th class="px-4 py-4 text-center">إجمالي الشخص</th>
              <th class="px-4 py-4 text-center">حذف</th>
            </tr>
          </thead>
          <tbody id="table" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>

  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
