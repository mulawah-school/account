<script>

let data = JSON.parse(localStorage.getItem("daily_sales") || "[]")

function save(){

const name = document.getElementById("name").value
const phone = document.getElementById("phone").value
const product = document.getElementById("product").value

const received = Number(document.getElementById("received").value)
const sold = Number(document.getElementById("sold").value)

const price = Number(document.getElementById("price").value)

const percent = Number(document.getElementById("percent").value)

const remaining = received - sold

const total = sold * price

const profit = total * (percent/100)

let found = false

data.forEach(item=>{

if(item.name === name && item.product === product){

item.received += received
item.sold += sold
item.remaining = item.received - item.sold
item.total += total
item.profit += profit

found = true

}

})

if(!found){

data.push({

name:name,
phone:phone,
product:product,
received:received,
sold:sold,
remaining:remaining,
price:price,
total:total,
profit:profit

})

}

localStorage.setItem("daily_sales",JSON.stringify(data))

load()

}

function load(){

table.innerHTML=""

let totalSales = 0
let totalProfit = 0

data.forEach(d=>{

totalSales += d.total
totalProfit += d.profit

table.innerHTML += `

<tr>

<td>${d.name}</td>
<td>${d.phone}</td>
<td>${d.product}</td>
<td>${d.received}</td>
<td>${d.sold}</td>
<td>${d.remaining}</td>
<td>${d.price}</td>
<td>${d.total.toFixed(2)}</td>
<td>${d.profit.toFixed(2)}</td>

</tr>

`

})

document.getElementById("totalSales").innerText = totalSales.toFixed(2)
document.getElementById("totalProfit").innerText = totalProfit.toFixed(2)

}

load()

</script>
