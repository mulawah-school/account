<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>التقارير - نظام المحاسبة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body class="min-h-screen">
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 no-print">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="index.html" class="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-600">
          <i data-lucide="arrow-right"></i>
        </a>
        <h1 class="text-xl font-bold text-slate-800 uppercase">مركز التقارير</h1>
      </div>
      <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2">
        <i data-lucide="printer" class="w-4 h-4"></i> طباعة التقرير
      </button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
      <section class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-700 flex items-center gap-2"><i data-lucide="calendar"></i> المبيعات والديون</h3>
        <input id="from" placeholder="من تاريخ" class="w-full px-4 py-2 bg-slate-50 border rounded-xl outline-none text-sm"/>
        <input id="to" placeholder="إلى تاريخ" class="w-full px-4 py-2 bg-slate-50 border rounded-xl outline-none text-sm"/>
        <div class="grid grid-cols-2 gap-2">
          <button id="runSales" class="bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">المبيعات</button>
          <button id="runDebts" class="bg-amber-600 text-white py-2 rounded-xl text-xs font-bold">الديون</button>
        </div>
      </section>

      <section class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-700 flex items-center gap-2"><i data-lucide="package"></i> جرد المخزون</h3>
        <input id="until" placeholder="حتى تاريخ..." class="w-full px-4 py-2 bg-slate-50 border rounded-xl outline-none text-sm"/>
        <button id="runStock" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">توليد تقرير المخزون</button>
      </section>

      <section class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
        <h3 class="font-bold text-slate-700 flex items-center gap-2"><i data-lucide="pie-chart"></i> البيع اليومي</h3>
        <div class="flex gap-2">
          <input type="date" id="dailyDate" class="flex-grow px-2 py-1 bg-slate-50 border rounded-lg text-xs outline-none"/>
          <button onclick="dailySalesReport()" class="bg-teal-600 text-white px-3 py-1 rounded-lg text-xs font-bold">يومي</button>
        </div>
        <div class="flex gap-2">
          <input type="month" id="monthlyDate" class="flex-grow px-2 py-1 bg-slate-50 border rounded-lg text-xs outline-none"/>
          <button onclick="monthlySalesReport()" class="bg-teal-800 text-white px-3 py-1 rounded-lg text-xs font-bold">شهري</button>
        </div>
      </section>
    </div>

    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden min-h-[500px]">
      <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <div>
          <h2 id="title" class="text-2xl font-black text-slate-800">معاينة التقرير</h2>
          <p class="text-slate-500 text-sm mt-1">العملة: OMR</p>
        </div>
      </div>
      <div class="p-8 overflow-x-auto text-right">
        <table id="tbl" class="w-full text-sm">
          <thead id="head" class="text-slate-400 font-bold border-b border-slate-100"></thead>
          <tbody id="body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
